spring:
  application:
    name: SIGEPA
  datasource:
    url: jdbc:postgresql://localhost:5432/sigepa
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

server:
  port: 8080